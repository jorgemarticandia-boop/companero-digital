<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Será una estafa? Práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F9;--card:#fff;--ink:#14202B;--mute:#4A5A68;--pri:#0B4F8A;--onpri:#fff;--line:#C9D3DC;--warnbg:#FFE08A;--warnink:#4A3600;--ok:#1B6B3A;--okbg:#DDF3E4;--bad:#A12B2B;--badbg:#FBE1E1;--fs:20px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171D;--card:#19232C;--ink:#F1F5F8;--mute:#B6C3CE;--pri:#7DB8F0;--onpri:#08213A;--line:#3A4A58;--warnbg:#5A4600;--warnink:#FFE9A8;--ok:#7FD39B;--okbg:#173823;--bad:#F2A0A0;--badbg:#4A1E1E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171D;--card:#19232C;--ink:#F1F5F8;--mute:#B6C3CE;--pri:#7DB8F0;--onpri:#08213A;--line:#3A4A58;--warnbg:#5A4600;--warnink:#FFE9A8;--ok:#7FD39B;--okbg:#173823;--bad:#F2A0A0;--badbg:#4A1E1E;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 32px}
.practice{background:var(--warnbg);color:var(--warnink);font-weight:700;padding:10px 14px;border-radius:10px;text-align:center;font-size:.9rem}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:10px 0}
.tools button{font:inherit;font-size:.8rem;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.prog{font-size:.85rem;color:var(--mute);margin:4px 0 6px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}
h1{font-size:1.4rem;line-height:1.25;margin:0 0 10px}
p{margin:0 0 12px}
.msg{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.msg small{display:block;color:var(--mute);margin-bottom:6px}
.btn{display:block;width:100%;font:inherit;font-weight:700;min-height:60px;padding:14px 18px;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:var(--onpri);margin-top:12px;cursor:pointer;text-align:center}
.btn.sec{background:var(--card);color:var(--pri)}
.btn.bad{background:var(--card);color:var(--bad);border-color:var(--bad)}
.btn.good{background:var(--card);color:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb b{display:block;margin-bottom:4px}
.rule{background:var(--bg);border-left:6px solid var(--pri);padding:10px 14px;border-radius:8px;margin:12px 0}
.note{font-size:.85rem;color:var(--mute);margin-top:14px}
.home{display:inline-block;margin:2px 0 8px;padding:10px 0;font-weight:700;color:var(--pri);text-decoration:none}.home:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="./">← Volver a Compañero Digital</a>
  <div class="practice" role="note">🧪 PRÁCTICA. Todos los mensajes son inventados. Nadie te está escribiendo de verdad.</div>
  <div class="tools">
    <button id="big" type="button" aria-pressed="false">A+ Letra grande</button>
    <button id="con" type="button" aria-pressed="false">◐ Contraste</button>
  </div>
  <div class="prog" id="prog"></div>
  <div class="bar"><i id="barfill"></i></div>
  <main class="card" id="screen" aria-live="polite"></main>
  <p class="note">Juego educativo. Ante la duda, cortá y preguntale a alguien de confianza.</p>
</div>

<script>
var Q = [
 {from:"Número desconocido · SMS", text:"Hola, te puse de referencia y te va a llegar un código. Pasámelo, por favor.", scam:true,
  why:"Es para robarte el WhatsApp. Nunca compartas un código que te llegó por SMS, ni con alguien que parezca conocido."},
 {from:"Doña Rosa (contacto guardado) · WhatsApp", text:"Mañana te paso a buscar a las 9 para ir a misa. ¡Hasta mañana!", scam:false,
  why:"Es seguro: es una persona que conocés, no pide plata, códigos ni datos y no te apura."},
 {from:"Número nuevo · WhatsApp", text:"Mamá, perdí el celular, este es mi número nuevo. Necesito que me hagas una transferencia urgente.", scam:true,
  why:"Número nuevo, urgencia y plata. Llamá al número de siempre de tu hijo antes de transferir."},
 {from:"Premios · SMS", text:"¡Felicitaciones! Ganaste un premio. Para cobrarlo, pagá 150.000 Gs de envío en este enlace.", scam:true,
  why:"Nunca participaste, y te piden plata primero. Ignorá y no toques el enlace."},
 {from:"Tu nieta (contacto guardado) · WhatsApp", text:"Abuela, te mando la foto de la fiesta. ¡Todos te extrañamos!", scam:false,
  why:"Es seguro: es alguien de tu familia que ya tenés guardado y no pide nada."},
 {from:"Banco · Llamada", text:"Detectamos un movimiento raro en su cuenta. Confirme su clave y el código que le llegó para bloquearlo.", scam:true,
  why:"El banco nunca pide claves ni códigos. Cortá y llamá vos al número oficial del banco."},
 {from:"Llamada perdida · Número del exterior", text:"Llamada perdida (3 veces). ¿Devolvés la llamada?", scam:true,
  why:"Devolver llamadas a números raros del exterior puede costarte saldo. No devuelvas."},
 {from:"Envíos · WhatsApp", text:"Te llegó un paquete del exterior. Para recibirlo, pagá la aduana ahora.", scam:true,
  why:"No esperabas ningún paquete y te piden plata. No pagues nada y consultá con un familiar."}
];
var i=0, score=0, answered=false;
function show(){
  var el=document.getElementById('screen');
  document.getElementById('prog').textContent=i<Q.length?"Mensaje "+(i+1)+" de "+Q.length:"Resultado";
  document.getElementById('barfill').style.width=(Math.min(i,Q.length)/Q.length*100)+"%";
  if(i>=Q.length){
    var msg=score>=7?"¡Excelente! Ya sabés reconocer las señales.":score>=5?"¡Muy bien! Repasá los que fallaste y vas a estar listo.":"Buen comienzo. Probá de nuevo, se aprende practicando.";
    el.innerHTML="<h1>Acertaste "+score+" de "+Q.length+"</h1><p>"+msg+"</p><div class='rule'><strong>Regla de oro:</strong> frená si te apuran, te piden un código, una clave o plata, o te escribe alguien que no conocés.</div><button class='btn' data-a='again'>🔁 Jugar otra vez</button>";
    return;
  }
  var q=Q[i]; answered=false;
  el.innerHTML="<h1>¿Será una estafa?</h1><div class='msg'><small>"+q.from+"</small>"+q.text+"</div><button class='btn good' data-a='safe'>✅ Es seguro</button><button class='btn bad' data-a='scam'>🚫 Es una estafa</button><div id='fb'></div>";
  window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||!b.dataset.a) return;
  var a=b.dataset.a;
  if(a==='again'){i=0;score=0;show();return;}
  if(a==='next'){i++;show();return;}
  if(answered) return;
  answered=true;
  var q=Q[i], right=(a==='scam')===q.scam;
  if(right) score++;
  var btns=document.querySelectorAll('#screen .btn'); btns.forEach(function(x){x.disabled=true;});
  document.getElementById('fb').innerHTML="<div class='fb "+(right?"ok":"no")+"'><b>"+(right?"¡Correcto!":"Ojo, la respuesta era otra.")+"</b>"+q.why+"</div><button class='btn' data-a='next'>"+(i<Q.length-1?"Siguiente mensaje →":"Ver resultado")+"</button>";
});
var root=document.documentElement;
document.getElementById('big').addEventListener('click',function(){
  var on=this.getAttribute('aria-pressed')!=='true';
  this.setAttribute('aria-pressed',on);
  root.style.setProperty('--fs',on?'24px':'20px');
});
document.getElementById('con').addEventListener('click',function(){
  var on=this.getAttribute('aria-pressed')!=='true';
  this.setAttribute('aria-pressed',on);
  root.setAttribute('data-theme',on?'dark':'light');
});
show();
</script>
</body>
</html>
