<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica: Zoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F9;--card:#fff;--ink:#14202B;--mute:#4A5A68;--pri:#0B4F8A;--onpri:#fff;--line:#C9D3DC;--warnbg:#FFE08A;--warnink:#4A3600;--ok:#1B6B3A;--okbg:#DDF3E4;--bad:#A12B2B;--fs:20px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171D;--card:#19232C;--ink:#F1F5F8;--mute:#B6C3CE;--pri:#7DB8F0;--onpri:#08213A;--line:#3A4A58;--warnbg:#5A4600;--warnink:#FFE9A8;--ok:#7FD39B;--okbg:#173823;--bad:#F2A0A0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171D;--card:#19232C;--ink:#F1F5F8;--mute:#B6C3CE;--pri:#7DB8F0;--onpri:#08213A;--line:#3A4A58;--warnbg:#5A4600;--warnink:#FFE9A8;--ok:#7FD39B;--okbg:#173823;--bad:#F2A0A0;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 32px}
.practice{background:var(--warnbg);color:var(--warnink);font-weight:700;padding:10px 14px;border-radius:10px;text-align:center;font-size:.9rem}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:10px 0}
.tools button{font:inherit;font-size:.8rem;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.prog{font-size:.85rem;color:var(--mute);margin:4px 0 6px;min-height:1.3em}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}
h1{font-size:1.4rem;line-height:1.25;margin:0 0 10px}
p{margin:0 0 12px}
.btn{display:block;width:100%;font:inherit;font-weight:700;min-height:60px;padding:14px 18px;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:var(--onpri);margin-top:12px;cursor:pointer;text-align:center}
.btn.sec{background:var(--card);color:var(--pri)}
:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
.screen{border:3px solid var(--line);border-radius:14px;overflow:hidden;margin:12px 0;background:#1d2733;color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.tile{background:#33414f;border-radius:8px;padding:18px 6px;text-align:center;font-size:.85rem;min-height:70px}
.tile.you{outline:2px solid #6fb3ff}
.toolbar{display:flex;justify-content:space-around;gap:4px;background:#0f161d;padding:8px 4px}
.tb{flex:1;text-align:center;font-size:.7rem;padding:6px 2px;border-radius:8px;color:#d7e0e8}
.tb b{display:block;font-size:1.2rem;font-weight:400}
.tb.hl{background:#F5C400;color:#1a1a1a;font-weight:700}
.tb.red{color:#ff8a8a}
.pop{background:#fff;color:#14202B;border-radius:10px;margin:8px;padding:10px 12px;font-size:.85rem}
.pop .opt{padding:8px;border-radius:8px;border:2px solid #C9D3DC;margin-top:6px}
.pop .opt.hl{border-color:#0B4F8A;font-weight:700;background:#EAF3FC}
.mock{border:3px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:var(--bg)}
.mock .row{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.mock .row.on{border-color:var(--pri);font-weight:700}
.tip{background:var(--bg);border-left:6px solid var(--pri);padding:10px 14px;border-radius:8px;margin:12px 0}
.warn{background:var(--warnbg);color:var(--warnink);border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:700}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;background:var(--okbg);color:var(--ok);font-weight:700}
.btn.voz{background:var(--card);color:var(--pri);min-height:54px;margin-top:0;margin-bottom:12px}
.note{font-size:.85rem;color:var(--mute);margin-top:14px}
.home{display:inline-block;margin:2px 0 8px;padding:10px 0;font-weight:700;color:var(--pri);text-decoration:none}.home:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="./">← Volver a Compañero Digital</a>
  <div class="practice" role="note">🧪 PRÁCTICA. Es una reunión de ejemplo. No hay nadie conectado de verdad.</div>
  <div class="tools">
    <button id="big" type="button" aria-pressed="false">A+ Letra grande</button>
    <button id="con" type="button" aria-pressed="false">◐ Contraste</button>
  </div>
  <div class="prog" id="prog"></div>
  <div class="bar"><i id="barfill"></i></div>
  <main class="card" id="screen" aria-live="polite"></main>
  <p class="note">Simulación educativa. Los botones de Zoom cambian de lugar según uses celular, tableta o computadora.</p>
</div>

<script>
function T(l,h){var c={a:["🎤","Audio"],v:["📹","Video"],p:["👥","Participantes"],c:["💬","Chat"],r:["🙌","Reacciones"],s:["🚪","Salir"]};
  return "<div class='toolbar'>"+["a","v","p","c","r","s"].map(function(k){return "<div class='tb"+(l===k?" hl":"")+(k==="s"?" red":"")+"'><b>"+c[k][0]+"</b>"+c[k][1]+"</div>";}).join("")+"</div>";}
function S(body,hl,pop){return "<div class='screen'><div class='tiles'><div class='tile'>👩 Dra. Pérez<br>(organizadora)</div><div class='tile'>👨 Participante</div><div class='tile you'>🙂 Vos</div><div class='tile'>👵 Doña Rosa</div></div>"+(pop||"")+T(hl)+"</div>";}
var M={
 entrar:{name:"🔗 Entrar a una reunión",steps:[
  ["Recibí el enlace","Entrá solo si esperabas esta reunión y te la mandó alguien que conocés, como tu profesor, tu médico o tu familiar.","<div class='mock'><div class='row'>👩 Dra. Pérez: «Mañana a las 9 es el taller. Entrá acá:»</div><div class='row on'>🔗 enlace-de-ejemplo</div></div>","Tocar el enlace"],
  ["Poné tu nombre","Zoom te pide un nombre. Escribí el tuyo para que te reconozcan.","<div class='mock'><div class='row'>Tu nombre: <strong>Jorge M.</strong></div><div class='row on'>Entrar a la reunión</div></div>","Tocar «Entrar»"],
  ["Ya estás adentro","Vas a ver a los demás. Abajo están los botones. Si Zoom pide permiso para el micrófono o la cámara, elegí «Permitir» solo si querés participar.",S("",null),"Entendido"]]},
 mic:{name:"🎤 Micrófono",steps:[
  ["Buscá el botón Audio","Abajo a la izquierda está el micrófono 🎤. Si tiene una raya roja, estás en silencio.",S("",'a'),"Tocar «Audio»"],
  ["Conectá el audio","Si aparece «Conectar al audio» o «Unirse al audio», tocalo. Después tocá el micrófono para que te escuchen.",S("",'a',"<div class='pop'>¿Cómo querés escuchar?<div class='opt hl'>📞 Conectar al audio</div><div class='opt'>Cancelar</div></div>"),"Tocar «Conectar al audio»"],
  ["Silenciate cuando no hablás","Cuando otra persona habla, silenciá tu micrófono para que no se escuche el ruido de tu casa. Tocá de nuevo para hablar.",S("",'a'),"Tocar el micrófono"]]},
 cam:{name:"📹 Cámara",steps:[
  ["Buscá el botón Video","Abajo hay una cámara 📹. Con raya, el video está apagado.",S("",'v'),"Tocar «Video»"],
  ["Permití la cámara","Si el teléfono pregunta, elegí «Permitir» solo si querés que te vean.",S("",'v',"<div class='pop'>Zoom quiere usar la cámara<div class='opt hl'>Permitir</div><div class='opt'>No permitir</div></div>"),"Tocar «Permitir»"],
  ["Mirá qué se ve atrás","Antes de encenderla, fijate qué hay detrás tuyo. Podés apagarla tocando el mismo botón.",S("",'v'),"Entendido"]]},
 mano:{name:"🙌 Levantar la mano",steps:[
  ["Mostrá los botones","Si no los ves, tocá la pantalla o mové el mouse.",S("",'r'),"Tocar «Reacciones»"],
  ["Elegí «Levantar la mano»","En algunas versiones está en «Más», en los tres puntitos o en «Participantes».",S("",'r',"<div class='pop'><div class='opt'>👍 Aplaudir</div><div class='opt hl'>✋ Levantar la mano</div></div>"),"Tocar «Levantar la mano»"],
  ["Esperá tu turno","Quien dirige la reunión te va a dar la palabra. Cuando termines, bajá la mano.",S("",'r',"<div class='pop'><div class='opt hl'>✋ Bajar la mano</div></div>"),"Tocar «Bajar la mano»"]]},
 salir:{name:"🚪 Salir de la reunión",steps:[
  ["Tocá «Salir»","El botón rojo está abajo a la derecha. Salir no cierra la reunión para los demás.",S("",'s'),"Tocar «Salir»"],
  ["Confirmá","Zoom pregunta si estás seguro. Tocá «Salir de la reunión».",S("",'s',"<div class='pop'><div class='opt hl' style='color:#A12B2B'>Salir de la reunión</div><div class='opt'>Cancelar</div></div>"),"Tocar «Salir de la reunión»"]]},
 seg:{name:"🛡️ Reuniones seguras",steps:[
  ["Entrá solo a reuniones que esperabas","Un enlace de Zoom que te llega de un desconocido puede ser una estafa.","<div class='mock'><div class='row'>📩 Número desconocido: «Tenés una reunión urgente con el banco. Entrá ya: enlace-raro»</div></div><div class='warn'>🚫 No toques ese enlace. Preguntale a alguien de confianza.</div>","Entendido: no entro"],
  ["Nadie serio te pide datos en una reunión","Ni el banco ni el IPS te piden claves, códigos ni plata por Zoom.","<div class='warn'>🚫 Si te piden claves, códigos o plata, salí de la reunión.</div>","Entendido"],
  ["No compartas pantalla sin entender","«Compartir pantalla» muestra lo que hay en tu celular, incluso mensajes y claves. Hacelo solo con alguien de confianza.","<div class='mock'><div class='row on'>🖥️ Compartir pantalla</div></div><div class='tip'>Si no sabés qué es, no lo toques.</div>","Entendido"]]}
};
var mod=null,idx=0,done={};
function menu(){mod=null;document.getElementById('prog').textContent="Elegí qué querés practicar";document.getElementById('barfill').style.width="0%";
  var s="<h1>Practicá Zoom</h1><button class='btn voz' data-say='menu'>🔊 Escuchar</button><p>Elegí una práctica. Podés repetirlas todas las veces que quieras.</p>";
  Object.keys(M).forEach(function(k){s+="<button class='btn sec' data-m='"+k+"'>"+(done[k]?"✅ ":"")+M[k].name+"</button>";});
  document.getElementById('screen').innerHTML=s;}
function step(){var m=M[mod],n=m.steps.length;
  if(idx>=n){done[mod]=true;document.getElementById('prog').textContent=m.name;document.getElementById('barfill').style.width="100%";
    document.getElementById('screen').innerHTML="<h1>¡Muy bien!</h1><div class='fb'>Terminaste: "+m.name+"</div><p style='margin-top:12px'>En una reunión real, el lugar de los botones puede cambiar. Si te perdés, pedí ayuda a un familiar.</p><button class='btn' data-menu='1'>Volver al menú</button><button class='btn sec' data-m='"+mod+"'>🔁 Practicar otra vez</button>";return;}
  var s=m.steps[idx];
  document.getElementById('prog').textContent=m.name+" · Paso "+(idx+1)+" de "+n;
  document.getElementById('barfill').style.width=((idx+1)/n*100)+"%";
  document.getElementById('screen').innerHTML="<h1>"+s[0]+"</h1><button class='btn voz' data-say='1'>🔊 Escuchar este paso</button><p>"+s[1]+"</p>"+s[2]+"<button class='btn' data-next='1'>👆 "+s[3]+"</button>"+(idx>0?"<button class='btn sec' data-prev='1'>← Atrás</button>":"")+"<button class='btn sec' data-menu='1'>Salir al menú</button>";}
function hablar(t){if('speechSynthesis' in window){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='es-PY';u.rate=.85;window.speechSynthesis.speak(u);}else{alert('La lectura en voz alta no está disponible en este dispositivo. Podés leer las instrucciones en pantalla.');}}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.say){if(d.say==='menu'){hablar(document.querySelector('#screen h1').textContent+'. Elegí una práctica. Podés repetirlas todas las veces que quieras.');}else{var st=M[mod].steps[idx];hablar(st[0]+'. '+st[1]+' Cuando estés listo, tocá: '+st[3]+'.');}return;}
  if(d.m){mod=d.m;idx=0;step();window.scrollTo(0,0);}
  else if(d.next){idx++;step();window.scrollTo(0,0);}
  else if(d.prev){idx--;step();window.scrollTo(0,0);}
  else if(d.menu){menu();window.scrollTo(0,0);}});
var root=document.documentElement;
document.getElementById('big').addEventListener('click',function(){var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);root.style.setProperty('--fs',on?'24px':'20px');});
document.getElementById('con').addEventListener('click',function(){var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);root.setAttribute('data-theme',on?'dark':'light');});
menu();
</script>
</body>
</html>
