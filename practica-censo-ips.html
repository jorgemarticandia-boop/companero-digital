<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica: censo de jubilados del IPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F9;--card:#fff;--ink:#14202B;--mute:#4A5A68;--pri:#0B4F8A;--onpri:#fff;--line:#C9D3DC;--warnbg:#FFE08A;--warnink:#4A3600;--ok:#1B6B3A;--okbg:#DDF3E4;--fs:20px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171D;--card:#19232C;--ink:#F1F5F8;--mute:#B6C3CE;--pri:#7DB8F0;--onpri:#08213A;--line:#3A4A58;--warnbg:#5A4600;--warnink:#FFE9A8;--ok:#7FD39B;--okbg:#173823;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171D;--card:#19232C;--ink:#F1F5F8;--mute:#B6C3CE;--pri:#7DB8F0;--onpri:#08213A;--line:#3A4A58;--warnbg:#5A4600;--warnink:#FFE9A8;--ok:#7FD39B;--okbg:#173823;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 32px}
.practice{background:var(--warnbg);color:var(--warnink);font-weight:700;padding:10px 14px;border-radius:10px;text-align:center;font-size:.9rem}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:10px 0}
.tools button{font:inherit;font-size:.8rem;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.prog{font-size:.85rem;color:var(--mute);margin:4px 0 6px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}
h1{font-size:1.45rem;line-height:1.25;margin:0 0 10px}
p{margin:0 0 12px}
ul.chk{list-style:none;padding:0;margin:0}
ul.chk li{padding:9px 0;border-bottom:1px solid var(--line)}
ul.chk li:last-child{border:0}
.btn{display:block;width:100%;font:inherit;font-weight:700;min-height:60px;padding:14px 18px;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:var(--onpri);margin-top:12px;cursor:pointer;text-align:center}
.btn.sec{background:var(--card);color:var(--pri)}
.btn.sel{outline:4px solid var(--ok);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
.mock{border:2px dashed var(--line);border-radius:12px;padding:14px;margin:12px 0;background:var(--bg)}
.mock label{display:block;font-size:.85rem;color:var(--mute);margin-top:8px}
.mock .f{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
.yellow{background:#F5C400;color:#1a1a1a;font-weight:700;border-radius:10px;padding:12px;text-align:center}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;background:var(--okbg);color:var(--ok);font-weight:700}
.tip{background:var(--bg);border-left:6px solid var(--pri);padding:10px 14px;border-radius:8px;margin:12px 0}
.note{font-size:.85rem;color:var(--mute);margin-top:14px}
.nav{display:flex;gap:10px}
.nav .btn{margin-top:14px}
.home{display:inline-block;margin:2px 0 8px;padding:10px 0;font-weight:700;color:var(--pri);text-decoration:none}.home:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="./">← Volver a Compañero Digital</a>
  <div class="practice" role="note">🧪 PRÁCTICA. Es un ejemplo. No pongas tus datos reales. No se envía ningún censo de verdad.</div>
  <div class="tools">
    <button id="big" type="button" aria-pressed="false">A+ Letra grande</button>
    <button id="con" type="button" aria-pressed="false">◐ Contraste</button>
  </div>
  <div class="prog" id="prog"></div>
  <div class="bar"><i id="barfill"></i></div>
  <main class="card" id="screen" aria-live="polite"></main>
  <div class="nav" id="nav"></div>
  <p class="note">Simulación educativa. No está conectada al IPS. El censo real se completa solo en el portal oficial.</p>
</div>

<script>
var i=0, done={};
function tog(k,label,doneLabel){return "<button class='btn "+(done[k]?"":"sec")+"' data-t='"+k+"'>"+(done[k]?"✅ "+doneLabel:label)+"</button>";}
function ch(k,opts,txt){var s="<p>"+txt+"</p>";opts.forEach(function(o){s+="<button class='btn sec"+(done[k]===o?" sel":"")+"' data-c='"+k+"' data-v='"+o+"'>"+o+"</button>";});return s;}
var S=[
 {t:"Vas a practicar el censo de jubilados del IPS",
  h:function(){return "<p>El censo sirve para <strong>actualizar tus datos</strong> en el IPS. Es digital, gratis y obligatorio.</p><div class='tip'>🔎 <strong>Fijate el plazo</strong> en el portal oficial del IPS. Según la prensa, vencía el 7 de diciembre de 2026.</div><p>Hoy practicás con datos de ejemplo, sin riesgo.</p>";}},
 {t:"Qué vas a necesitar",
  h:function(){return "<ul class='chk'><li>✅ Tu cédula de identidad vigente</li><li>✅ Un celular con cámara (o computadora)</li><li>✅ Datos de tu cónyuge e hijos, si corresponde</li><li>✅ Hasta 2 contactos de familiares</li><li>✅ Un lugar con buena luz para sacar las fotos</li></ul>";}},
 {t:"Entrá solo desde la página oficial",
  h:function(){return "<p>Escribí vos mismo la dirección en el navegador:</p><div class='mock'><strong>portal.ips.gov.py</strong></div><p>Ahí vas a ver un botón amarillo:</p><div class='yellow'>Censo Digital de Jubilados y Pensionados</div><div class='tip'>🛡️ <strong>No entres desde enlaces que te lleguen por mensaje.</strong> Pueden ser falsos y pedirte tus datos.</div>";}},
 {t:"Paso 1: Validá tu identidad",
  h:function(){var f=done.id;return "<p>Primero el sistema comprueba que sos vos. Tocá el botón para completar con datos de ejemplo.</p><div class='mock'><label>Número de cédula</label><div class='f'>"+(f?"1.234.567":"&nbsp;")+"</div><label>Fecha de emisión de la cédula</label><div class='f'>"+(f?"15/03/2019":"&nbsp;")+"</div><label>Celular de contacto</label><div class='f'>"+(f?"0981 000 000":"&nbsp;")+"</div></div>"+tog('id','Completar con datos de ejemplo','Datos de ejemplo cargados');},gate:'id'},
 {t:"Paso 2: Tu vivienda",
  h:function(){return ch('viv',['📍 Usar la ubicación de mi celular','⌨️ Escribir mi dirección'],"Completá dónde vivís. Usá la ubicación <strong>solo si estás en tu casa</strong>.");},gate:'viv'},
 {t:"Paso 3: Tu familia",
  h:function(){return ch('fam',['Con cónyuge e hijos','Sin cónyuge ni hijos'],"Indicá tu situación. Si tenés cónyuge o hijos, cargá sus datos y cédulas.")+"<div class='tip'>Podés agregar hasta <strong>2 contactos familiares</strong> para que el IPS se comunique si hace falta.</div>";},gate:'fam'},
 {t:"Paso 4: Discapacidad y salud",
  h:function(){return ch('sal',['No me aplica','Sí me aplica'],"Completá esta parte <strong>solo si te corresponde</strong>.");},gate:'sal'},
 {t:"Paso 5: Subí tus documentos",
  h:function(){return "<p>Se piden 3 fotos. Cada archivo puede pesar hasta 5 MB y ser PDF, JPG o PNG.</p>"+tog('d1','📷 Cédula, parte de adelante','Adelante cargado')+tog('d2','📷 Cédula, parte de atrás','Atrás cargado')+tog('d3','🤳 Selfie sosteniendo la cédula','Selfie cargada')+"<div class='tip'>💡 Con buena luz, sin reflejos, y que se lean todos los datos.</div>";},
  gate:function(){return done.d1&&done.d2&&done.d3;}},
 {t:"Revisá y enviá",
  h:function(){var s=done.sent;return "<p>Antes de enviar, revisá que todo esté bien.</p><div class='mock'>✅ Identidad validada<br>✅ Vivienda: "+(done.viv||"")+"<br>✅ Familia: "+(done.fam||"")+"<br>✅ Documentos: 3 de 3</div>"+(s?"<div class='fb'>¡Listo! Censo de práctica enviado.</div>":"<button class='btn' data-t='sent'>Enviar censo (práctica)</button>");},gate:'sent'},
 {t:"¡Muy bien, lo lograste!",
  h:function(){return "<ul class='chk'><li>✅ Cuando lo hagas de verdad, usá <strong>tus propios datos</strong> y solo el portal oficial.</li><li>🔸 Si te trabás, podés pedir ayuda a un familiar o ir a un centro de atención de Jubilaciones del IPS.</li><li>🔸 El censo <strong>no reemplaza</strong> la comprobación de supervivencia (fe de vida).</li></ul><button class='btn sec' data-r='1'>🔁 Practicar otra vez</button>";}}
];
function ok(s){if(!s.gate)return true;return typeof s.gate==='function'?s.gate():!!done[s.gate];}
function render(){
  var s=S[i];
  document.getElementById('prog').textContent="Paso "+(i+1)+" de "+S.length;
  document.getElementById('barfill').style.width=((i+1)/S.length*100)+"%";
  document.getElementById('screen').innerHTML="<h1>"+s.t+"</h1>"+s.h();
  var n="";
  if(i>0)n+="<button class='btn sec' data-n='-1'>← Atrás</button>";
  if(i<S.length-1)n+="<button class='btn' data-n='1'"+(ok(s)?"":" disabled")+">Siguiente →</button>";
  document.getElementById('nav').innerHTML=n;
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset;
  if(d.n){i+=parseInt(d.n,10);render();window.scrollTo(0,0);return;}
  if(d.t){done[d.t]=true;render();return;}
  if(d.c){done[d.c]=d.v;render();return;}
  if(d.r){done={};i=0;render();window.scrollTo(0,0);}
});
var root=document.documentElement;
document.getElementById('big').addEventListener('click',function(){var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);root.style.setProperty('--fs',on?'24px':'20px');});
document.getElementById('con').addEventListener('click',function(){var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);root.setAttribute('data-theme',on?'dark':'light');});
render();
</script>
</body>
</html>
